[project]
name = "desensitization-tool"
version = "0.1.0"
description = "一键脱敏本地脚本：本地识别敏感标识符并脱敏，映射表 AES 加密分离存储"
# Python 版本按全部依赖兼容性综合确定：onnxruntime 无 free-threaded wheel、
# 3.14 支持未完备，故限定标准 CPython >=3.10 且 <3.14
requires-python = ">=3.10,<3.14"
dependencies = [
    "cryptography>=42.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "pypdfium2>=4.30",        # PDF 文本抽取 + 页面渲染（Chrome 同款 PDFium）
    "pikepdf>=9.11.0",        # 本地解密 PDF
    "msoffcrypto-tool>=6.0.0",# 本地解密 Office
    "rapidocr>=3.9",          # 本地 OCR（模型随 wheel 捆绑，完全离线）
    "onnxruntime>=1.19",      # rapidocr 推理后端
    "charset-normalizer>=3.0",# 编码探测（cp932/Shift-JIS、big5、cp1252、gb18030；纯 Python 离线）
]

[project.optional-dependencies]
presidio = ["presidio-analyzer", "presidio-anonymizer"]

[tool.uv]
package = false
